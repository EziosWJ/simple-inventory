name: Database compatibility gate

on:
  push:
    paths:
      - "server/**"
      - "web/**"
      - "Taskfile.yml"
      - ".github/workflows/database-compatibility.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "Taskfile.yml"
      - ".github/workflows/database-compatibility.yml"

permissions:
  contents: read

jobs:
  embedded-release:
    name: Embedded frontend release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Prepare embedded frontend
        run: cp -R web/dist server/internal/webui/dist
      - name: Verify embedded release
        working-directory: server
        run: |
          go test -tags=embedweb ./...
          go vet -tags=embedweb ./...
          go build -tags=embedweb -trimpath -o ../bin/simple-inventory-api ./cmd/api

  backend-check:
    name: Backend unit tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run backend check
        run: |
          go test ./...
          go vet ./...

  sqlite-contract:
    name: SQLite migration, API and backup contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check migration streams
        run: go test ./migrations
      - name: Run SQLite integration contract
        run: go test -tags=integration ./integration -run ^TestSQLite -count=1

  postgres-contract:
    name: PostgreSQL integration contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The contract starts postgres:17-alpine and shells out to pg_dump, so the
      # runner needs a client that is not older than that server.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # The runner image keeps an older client earlier on PATH, so put 17
          # first: the contract's pg_dump must never be older than the server.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Verify PostgreSQL 17 client
        run: |
          command -v pg_dump
          pg_dump --version
          pg_dump --version | grep -qE ' 17\.'
      - name: Run PostgreSQL integration contract
        run: >-
          go test -tags=integration ./integration
          -run '^Test(Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage|Product|Partner|Warehouse|Purchase|Sale)'
          -count=1
