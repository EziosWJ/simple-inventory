name: Database compatibility gate

on:
  push:
    paths:
      - "server/**"
      - "Taskfile.yml"
      - ".github/workflows/database-compatibility.yml"
  pull_request:
    paths:
      - "server/**"
      - "Taskfile.yml"
      - ".github/workflows/database-compatibility.yml"

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend unit tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run backend check
        run: |
          go test ./...
          go vet ./...

  sqlite-contract:
    name: SQLite migration, API and backup contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check migration streams
        run: go test ./migrations
      - name: Run SQLite integration contract
        run: go test -tags=integration ./integration -run ^TestSQLite -count=1

  postgres-contract:
    name: PostgreSQL integration contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run PostgreSQL integration contract
        run: >-
          go test -tags=integration ./integration
          -run '^Test(Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage|Product|Partner|Warehouse|Purchase|Sale)'
          -count=1
