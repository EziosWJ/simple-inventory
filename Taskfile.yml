# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  APP_ENV: dev
  GOCACHE: '{{.ROOT_DIR}}/.task/go-build'

tasks:
  default:
    desc: 显示可用任务
    cmds:
      - task --list
    silent: true

  db:migrate:
    desc: 执行数据库结构和种子数据迁移
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:sqlite:
    desc: 使用 SQLite 配置执行数据库结构和种子数据迁移
    dir: server
    env:
      APP_CONFIG_PROFILE: sqlite
    cmds:
      - go run ./cmd/migrate up --kind all

  db:migrate:schema:
    desc: 仅执行数据库结构迁移
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind schema

  db:migrate:seed:
    desc: 仅执行种子数据迁移
    dir: server
    cmds:
      - go run ./cmd/migrate up --kind seed

  db:backup:
    desc: 创建 SQLite 在线备份，通过 CLI_ARGS 传递命令行参数
    dir: server
    cmds:
      - go run ./cmd/backup {{.CLI_ARGS}}

  api:
    desc: 启动 Go API
    dir: server
    cmds:
      - go run ./cmd/api

  api:sqlite:
    desc: 使用 SQLite 配置启动 Go API
    dir: server
    env:
      APP_CONFIG_PROFILE: sqlite
    cmds:
      - go run ./cmd/api

  api:docs:
    desc: 使用仓库指定的版本和参数生成 Swagger 文档
    dir: server
    env:
      GOFLAGS: -mod=mod
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.8.12 init -g cmd/api/main.go -o docs -d .

  web:
    desc: 启动 React 开发服务器
    dir: web
    cmds:
      - npm run dev

  dev:
    desc: 执行数据库迁移并同时启动 API 和前端
    deps:
      - db:migrate
    cmds:
      - task --parallel api web

  dev:sqlite:
    desc: 执行 SQLite 迁移并同时启动 SQLite API 和前端
    env:
      APP_CONFIG_PROFILE: sqlite
    deps:
      - db:migrate:sqlite
    cmds:
      - task --parallel api:sqlite web

  backend:test:
    desc: 运行后端单元测试
    dir: server
    cmds:
      - go test ./...

  backend:integration:
    desc: 运行后端 PostgreSQL 集成测试
    dir: server
    cmds:
      - go test -tags=integration ./integration -run '^Test(Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage|Product|Partner|Warehouse|Purchase|Sale)' -count=1

  db:integration:postgres:
    desc: 运行 PostgreSQL 数据库集成契约测试
    dir: server
    cmds:
      - go test -tags=integration ./integration -run '^Test(Postgres|Auth|RBAC|SysConfig|Department|Dictionary|Login|File|Notification|UserPage|Product|Partner|Warehouse|Purchase|Sale)' -count=1

  db:integration:sqlite:
    desc: 运行文件型 SQLite 数据库集成契约测试
    dir: server
    cmds:
      - go test -tags=integration ./integration -run '^TestSQLite' -count=1

  db:contract:
    desc: 按名字运行集成契约，CLI_ARGS 传 -run 正则，例如 task db:contract -- '^TestSQLiteSale|^TestPostgresSale'
    dir: server
    cmds:
      - go test -tags=integration ./integration -run '{{.CLI_ARGS}}' -count=1

  db:check:
    desc: 运行后端检查及两种数据库的集成契约测试
    deps:
      - backend:check
      - db:integration:postgres
      - db:integration:sqlite

  backend:check:
    desc: 运行后端测试和静态检查
    dir: server
    cmds:
      - go test ./...
      - go vet ./...

  frontend:lint:
    desc: 运行前端代码检查
    dir: web
    cmds:
      - npm run lint

  frontend:build:
    desc: 构建前端
    dir: web
    cmds:
      - npm run build

  check:
    desc: 运行后端和前端检查
    deps:
      - backend:check
      - frontend:lint
      - frontend:build

  build:
    desc: 构建将生产版前端嵌入 API 的发布程序
    deps:
      - frontend:build
    dir: server
    cmds:
      - rm -rf internal/webui/dist
      - mkdir -p internal/webui/dist ../bin
      - cp -R ../web/dist/. internal/webui/dist/
      - go build -tags=embedweb -trimpath -o ../bin/simple-inventory-api ./cmd/api
      - go build -trimpath -o ../bin/simple-inventory-migrate ./cmd/migrate
      - go build -trimpath -o ../bin/simple-inventory-backup ./cmd/backup

  build:check:
    desc: 构建发布程序并检查嵌入前端资源的测试与代码
    deps:
      - build
    dir: server
    cmds:
      - go test -tags=embedweb ./...
      - go vet -tags=embedweb ./...

  container:build:
    desc: 构建包含 API、迁移和备份工具的单一发布镜像
    cmds:
      - bash deploy/production/build-images.sh {{.CLI_ARGS}}

  test:
    desc: 运行默认测试套件
    deps:
      - backend:test
