services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simple_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-simple_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - simple_inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      APP_ENV: dev
      APP_DATABASE__URL: postgres://postgres:5432/${POSTGRES_DB:-simple_inventory}?sslmode=disable
      APP_DATABASE__USERNAME: ${POSTGRES_USER:-simple_inventory}
      APP_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT__SECRET: ${APP_JWT__SECRET:?set APP_JWT__SECRET in .env}
      APP_LOG__LEVEL: debug
      APP_LOG__FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up", "--kind", "all"]
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: dev
      APP_DATABASE__URL: postgres://postgres:5432/${POSTGRES_DB:-simple_inventory}?sslmode=disable
      APP_DATABASE__USERNAME: ${POSTGRES_USER:-simple_inventory}
      APP_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT__SECRET: ${APP_JWT__SECRET:?set APP_JWT__SECRET in .env}
      APP_SWAGGER__ENABLED: "true"
      APP_LOG__LEVEL: debug
      APP_LOG__FORMAT: text
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - simple_inventory_uploads:/var/lib/simple-inventory/uploads
    restart: unless-stopped

volumes:
  simple_inventory_postgres_data:
    name: simple_inventory_postgres_data
  simple_inventory_uploads:
    name: simple_inventory_uploads
